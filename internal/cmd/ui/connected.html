<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>V5VPN 已连接</title>
  <style>
    html, body { margin: 0; background: #0b1120; color: #f8fafc; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    .wrap { padding: 20px 24px 48px; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .sub { color: #94a3b8; margin-bottom: 16px; }
    .row { margin: 8px 0; font-size: 15px; }
    code { color: #38bdf8; font-size: 15px; }
    button { background: #ef4444; color: #fff; border: 0; border-radius: 8px; padding: 8px 16px; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 13px; }
    th, td { border-bottom: 1px solid #223254; padding: 8px 10px; text-align: left; }
    th { color: #94a3b8; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>已连接</h1>
    <div class="sub" id="detail">正在读取连接状态…</div>
    <div class="row">SOCKS5 代理：<code id="socks">-</code></div>
    <div class="row">HTTP 代理：<code id="http">-</code></div>
    <div class="row"><button id="disc" type="button">断开连接</button></div>
    <table>
      <thead><tr><th>资源</th><th>内网地址</th><th>端口</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <script>
    function text(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    async function load() {
      const st = await (await fetch('/api/status')).json();
      document.getElementById('detail').textContent =
        (st.lastUseGateway || '') + ' · ' + (st.statusDetail || st.status || '');
      document.getElementById('socks').textContent = st.socks || '-';
      document.getElementById('http').textContent = st.httpProxy || '-';
      const tb = document.getElementById('tb');
      tb.innerHTML = '';
      (st.resources || []).forEach(function (r) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td>' + text(r.name) + '</td><td><code>' + text(r.remoteIp) +
          '</code></td><td>' + text(r.remotePort) + '</td>';
        tb.appendChild(tr);
      });
    }
    document.getElementById('disc').addEventListener('click', async function () {
      await fetch('/api/logout', { method: 'POST' });
      location.href = '/index.html';
    });
    load();
  </script>
</body>
</html>
