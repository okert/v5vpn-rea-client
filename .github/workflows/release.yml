name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft-release:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version alignment
        run: |
          expected="$(jq -r .version mygo.json)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$expected" ]; then
            echo "Tag ($tag) does not match mygo.json version ($expected)"
            exit 1
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            /^## / {
              if (found) exit
              h = $0; gsub(/[\[\]]/, "", h)
              if (h == "## " ver || h ~ "^## " ver " ") { found = 1 }
              next
            }
            found
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section for $ver, falling back to generated notes"
            gh release create "$GITHUB_REF_NAME" \
              --draft --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          elif ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --draft --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md
          else
            gh release edit "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md
          fi

  build:
    name: mygo build (${{ matrix.name }})
    needs: draft-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: darwin/arm64,darwin/amd64
          - name: Windows
            os: ubuntu-latest
            platform: windows/amd64,windows/arm64
          - name: Linux
            os: ubuntu-latest
            platform: linux/amd64,linux/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install NSIS
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: mygo build + upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
